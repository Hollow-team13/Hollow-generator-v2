name: Deploy GitHub Pages

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type-check the app
        run: pnpm --filter @workspace/hollow-generator run typecheck

      - name: Build for the GitHub Pages project URL
        run: pnpm --filter @workspace/hollow-generator run build
        env:
          NODE_ENV: production
          PORT: 4173
          BASE_PATH: /Hollow-generator-v2/

      - name: Publish static site to gh-pages
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/hollow-generator/dist/public
          publish_branch: gh-pages
